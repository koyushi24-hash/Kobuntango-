      { id: 148, word: "わびし", mean: "困った・つらい・わびしい", desc: "思い通りにならず辛い状態。" },
      { id: 149, word: "わろし", mean: "良くない・いまいちだ", desc: "「よろし」よりも劣る。" },
      { id: 150, word: "ゐる（居る）", mean: "座る・引き連れる", desc: "座る、または伴って行動する。" },
      { id: 151, word: "をかし", mean: "面白い・すぐれている・趣がある", desc: "知的な興味や美しさに感嘆する。" },
      { id: 152, word: "をり（居り）", mean: "ある・いる・座っている", desc: "「あり」の丁寧・存在表現。" }
    ];

    function App() {
      const [gameState, setGameState] = useState('home'); // home, quiz, result
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [wrongList, setWrongList] = useState([]);
      const [range, setRange] = useState('all'); // all, 1-50, 51-100, 101-152
      const [streak, setStreak] = useState(0);

      useEffect(() => {
        const savedStreak = localStorage.getItem('kobun_streak') || 0;
        setStreak(parseInt(savedStreak, 10));
      }, []);

      // クイズ作成ロジック
      const startQuiz = (selectedRange = range) => {
        let pool = [...VOCAB_DATA];
        if (selectedRange === '1-50') pool = pool.slice(0, 50);
        else if (selectedRange === '51-100') pool = pool.slice(50, 100);
        else if (selectedRange === '101-152') pool = pool.slice(100);

        // ランダムに10個抽出
        const shuffled = [...pool].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, Math.min(10, pool.length));

        const quizData = selected.map(item => {
          // ダミー選択肢（他の単語から3つ取得）
          const otherItems = VOCAB_DATA.filter(v => v.id !== item.id);
          const shuffledOthers = [...otherItems].sort(() => 0.5 - Math.random()).slice(0, 3);
          
          const options = [
            { text: item.mean, isCorrect: true, desc: item.desc },
            ...shuffledOthers.map(o => ({ text: o.mean, isCorrect: false, desc: o.desc }))
          ].sort(() => 0.5 - Math.random());

          return {
            targetWord: item.word,
            correctMean: item.mean,
            options: options,
            id: item.id
          };
        });

        setQuestions(quizData);
        setCurrentIndex(0);
        setScore(0);
        setSelectedOption(null);
        setIsAnswered(false);
        setWrongList([]);
        setGameState('quiz');
      };

      const handleSelectOption = (index) => {
        if (isAnswered) return;
        setSelectedOption(index);
        setIsAnswered(true);

        const currentQ = questions[currentIndex];
        if (currentQ.options[index].isCorrect) {
          setScore(prev => prev + 1);
        } else {
          setWrongList(prev => [...prev, currentQ]);
        }
      };

      const handleNextQuestion = () => {
        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(prev => prev + 1);
          setSelectedOption(null);
          setIsAnswered(false);
        } else {
          // 終了
          const newStreak = streak + 1;
          setStreak(newStreak);
          localStorage.setItem('kobun_streak', newStreak);
          setGameState('result');
        }
      };

      return (
        <div className="max-w-md mx-auto w-full flex-grow flex flex-col p-4">
          {/* ヘッダー */}
          <header className="text-center py-4 border-b-2 border-amber-800/20 mb-4">
            <h1 className="text-2xl font-bold font-mincho text-amber-900 tracking-wider">
              <i className="fa-solid fa-book-bookmark text-amber-700 mr-2"></i>
              古文単語 毎日5分マスター
            </h1>
            <p className="text-xs text-amber-800/70 mt-1">写真の152単語を完全攻略！</p>
          </header>

          {/* HOME 画面 */}
          {gameState === 'home' && (
            <div className="flex-grow flex flex-col justify-between py-6">
              <div className="bg-amber-100/60 rounded-2xl p-6 border border-amber-200 shadow-sm text-center">
                <div className="inline-block bg-amber-200 text-amber-900 px-4 py-1 rounded-full text-xs font-bold mb-3">
                  <i className="fa-solid fa-fire text-orange-500 mr-1"></i> 連続学習: {streak}日目
                </div>
                <h2 className="text-xl font-bold text-slate-800 font-mincho mb-2">今日の5分チェック</h2>
                <p className="text-sm text-slate-600 mb-6">
                  ランダムで10問出題されます。<br />毎日の反復で定着させましょう！
                </p>

                {/* 範囲選択 */}
                <div className="mb-6 text-left">
                  <label className="block text-xs font-bold text-amber-900 mb-2">出題範囲の選択：</label>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    {[
                      { key: 'all', label: '全152語（完全ランダム）' },
                      { key: '1-50', label: '1 ～ 50 番' },
                      { key: '51-100', label: '51 ～ 100 番' },
                      { key: '101-152', label: '101 ～ 152 番' },
                    ].map(item => (
                      <button
                        key={item.key}
                        onClick={() => setRange(item.key)}
                        className={`p-2.5 rounded-xl border text-center transition font-bold ${
                          range === item.key 
                            ? 'bg-amber-800 text-white border-amber-800 shadow' 
                            : 'bg-white text-slate-700 border-amber-200 hover:bg-amber-50'
                        }`}
                      >
                        {item.label}
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  onClick={() => startQuiz()}
                  className="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95 text-lg font-mincho flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-play"></i> テストを開始する
                </button>
              </div>

              <div className="text-center text-xs text-amber-800/60">
                画面上の「ホーム画面に追加」をするとアプリのようにいつでも1タップで起動できます！
              </div>
            </div>
          )}

          {/* QUIZ 画面 */}
          {gameState === 'quiz' && (
            <div className="flex-grow flex flex-col justify-between">
              <div>
                {/* 進行バー */}
                <div className="flex justify-between items-center text-xs text-amber-900 font-bold mb-2">
                  <span>第 {currentIndex + 1} 問 / 全 {questions.length} 問</span>
                  <span>スコア: {score}</span>
                </div>
                <div className="w-full bg-amber-200 rounded-full h-2 mb-6">
                  <div
                    className="bg-red-600 h-2 rounded-full transition-all duration-300"
                    style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}
                  ></div>
                </div>

                {/* 問題カード */}
                <div className="bg-white rounded-2xl p-6 shadow-md border border-amber-200 mb-6 text-center">
                  <span className="text-xs font-bold text-amber-700 bg-amber-100 px-3 py-1 rounded-full">古文単語</span>
                  <div className="text-3xl font-bold font-mincho text-slate-900 my-4 tracking-wide">
                    {questions[currentIndex].targetWord}
                  </div>
                  <p className="text-xs text-slate-500">正しい現代語訳を選んでください</p>
                </div>

                {/* 選択肢リスト */}
                <div className="space-y-3">
                  {questions[currentIndex].options.map((opt, idx) => {
                    let btnStyle = "bg-white text-slate-800 border-amber-200 hover:border-amber-400";
                    if (isAnswered) {
                      if (opt.isCorrect) {
                        btnStyle = "bg-emerald-100 text-emerald-900 border-emerald-500 font-bold";
                      } else if (selectedOption === idx) {
                        btnStyle = "bg-rose-100 text-rose-900 border-rose-400";
                      } else {
                        btnStyle = "bg-slate-50 text-slate-400 border-slate-200 opacity-60";
                      }
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => handleSelectOption(idx)}
                        disabled={isAnswered}
                        className={`w-full p-4 rounded-xl border-2 text-left text-sm transition-all flex items-center justify-between ${btnStyle}`}
                      >
                        <span>{opt.text}</span>
                        {isAnswered && opt.isCorrect && (
                          <i className="fa-solid fa-circle-check text-emerald-600 text-lg"></i>
                        )}
                        {isAnswered && selectedOption === idx && !opt.isCorrect && (
                          <i className="fa-solid fa-circle-xmark text-rose-500 text-lg"></i>
                        )}
                      </button>
                    );
                  })}
                </div>

                {/* 解説表示 */}
                {isAnswered && (
                  <div className="mt-4 p-4 rounded-xl bg-amber-100/80 border border-amber-300 text-xs text-amber-950">
                    <div className="font-bold mb-1 flex items-center gap-1">
                      <i className="fa-solid fa-lightbulb text-amber-600"></i> ワンポイント解説:
                    </div>
                    {questions[currentIndex].options.find(o => o.isCorrect)?.desc}
                  </div>
                )}
              </div>

              {/* 次へボタン */}
              {isAnswered && (
                <button
                  onClick={handleNextQuestion}
                  className="w-full mt-6 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl shadow transition font-mincho flex items-center justify-center gap-2"
                >
                  {currentIndex + 1 === questions.length ? '結果を見る' : '次の問題へ'}
                  <i className="fa-solid fa-arrow-right"></i>
                </button>
              )}
            </div>
          )}

          {/* RESULT 画面 */}
          {gameState === 'result' && (
            <div className="flex-grow flex flex-col justify-between py-4">
              <div>
                <div className="bg-white rounded-2xl p-6 shadow-md border border-amber-200 text-center mb-6">
                  <h2 className="text-lg font-bold font-mincho text-slate-800 mb-2">お疲れ様でした！</h2>
                  <div className="text-4xl font-extrabold text-red-600 my-3 font-mincho">
                    {score} <span className="text-lg text-slate-600 font-sans">/ {questions.length} 問正解</span>
                  </div>
                  <p className="text-xs text-slate-600">
                    {score === 10 ? '素晴らしい！全問正解です！パーフェクト！' : 
                     score >= 7 ? 'お見事！あともう少しで満点です。' : '継続は力なり！復習してもう一度挑戦しましょう！'}
                  </p>
                </div>

                {/* 間違えた単語リスト */}
                {wrongList.length > 0 ? (
                  <div className="bg-red-50/70 border border-red-200 rounded-2xl p-4 mb-6">
                    <h3 className="text-xs font-bold text-red-900 mb-3 flex items-center gap-1">
                      <i className="fa-solid fa-triangle-exclamation"></i> 要復習の単語 ({wrongList.length}語)
                    </h3>
                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                      {wrongList.map((item, idx) => (
                        <div key={idx} className="bg-white p-3 rounded-lg border border-red-100 text-xs">
                          <div className="font-bold text-slate-900">{item.targetWord}</div>
                          <div className="text-red-700 font-semibold mt-0.5">意味：{item.correctMean}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center text-xs text-emerald-800 mb-6 font-bold">
                    <i className="fa-solid fa-award text-amber-500 text-xl block mb-1"></i>
                    素晴らしい！間違えた単語はありません！
                  </div>
                )}
              </div>

              <div className="space-y-3">
                <button
                  onClick={() => startQuiz()}
                  className="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3.5 rounded-xl shadow transition font-mincho flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-rotate-right"></i> もう一度挑戦する
                </button>
                <button
                  onClick={() => setGameState('home')}
                  className="w-full bg-amber-200 hover:bg-amber-300 text-amber-900 font-bold py-3 rounded-xl transition text-xs"
                >
                  ホームに戻る
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
