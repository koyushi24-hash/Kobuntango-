      { id: 145, word: "わたる（渡る）", mean: "行く・一面に～する・～し続ける", desc: "移動する、または補助動詞で継続。", hint: "ラ行四段動詞：移動する/〜し続ける" },
      { id: 146, word: "わたし", mean: "あたり・近所", desc: "周辺の地域。", hint: "名詞：近所・周辺" },

      { id: 148, word: "わびし", mean: "困った・つらい・わびしい", desc: "思い通りにならず辛い状態。", hint: "形容詞：困った・つらい" },
      { id: 149, word: "わろし", mean: "良くない・いまいちだ", desc: "「よろし」よりも劣る。", hint: "形容詞：良くはない・劣る" },

      { id: 152, word: "をり（居り）", mean: "ある・いる・座っている", desc: "「あり」の丁寧・存在表現。", hint: "ラ変動詞：座っている・存在する" }
    ];

    function App() {
      const [gameState, setGameState] = useState('home'); // home, quiz, result
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [fuzzyCount, setFuzzyCount] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [showHint, setShowHint] = useState(false);
      const [usedHint, setUsedHint] = useState(false);
      const [wrongList, setWrongList] = useState([]);
      const [fuzzyList, setFuzzyList] = useState([]);
      const [range, setRange] = useState('all');
      const [streak, setStreak] = useState(0);

      useEffect(() => {
        const savedStreak = localStorage.getItem('kobun_streak') || 0;
        setStreak(parseInt(savedStreak, 10));
      }, []);

      const shuffleArray = (array) => {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      };

      const getBalancedSample = (pool, count = 10) => {
        if (pool.length <= count) return shuffleArray(pool);

        let history = [];
        try {
          history = JSON.parse(localStorage.getItem('kobun_history') || '[]');
        } catch (e) {
          history = [];
        }

        const historySet = new Set(history);
        const chunkSize = pool.length / count;
        const selected = [];

        for (let i = 0; i < count; i++) {
          const start = Math.floor(i * chunkSize);
          const end = Math.floor((i + 1) * chunkSize);
          const chunk = pool.slice(start, end);

          const unseenInChunk = chunk.filter(item => !historySet.has(item.id));
          const candidatePool = unseenInChunk.length > 0 ? unseenInChunk : chunk;

          const picked = candidatePool[Math.floor(Math.random() * candidatePool.length)];
          selected.push(picked);
        }

        const newHistory = [...history, ...selected.map(s => s.id)].slice(-60);
        try {
          localStorage.setItem('kobun_history', JSON.stringify(newHistory));
        } catch (e) {}

        return shuffleArray(selected);
      };

      const startQuiz = (selectedRange = range) => {
        let pool = [...VOCAB_DATA];
        if (selectedRange === '1-50') pool = pool.slice(0, 50);
        else if (selectedRange === '51-100') pool = pool.slice(50, 100);
        else if (selectedRange === '101-152') pool = pool.slice(100);

        const selected = getBalancedSample(pool, 10);

        const quizData = selected.map(item => {
          const otherItems = VOCAB_DATA.filter(v => v.id !== item.id);
          const shuffledOthers = shuffleArray(otherItems).slice(0, 3);
          
          const options = shuffleArray([
            { text: item.mean, isCorrect: true, desc: item.desc },
            ...shuffledOthers.map(o => ({ text: o.mean, isCorrect: false, desc: o.desc }))
          ]);

          return {
            targetWord: item.word,
            correctMean: item.mean,
            hint: item.hint || `ヒント：${item.word.split('（')[1]?.replace('）','') || '基本単語'}`,
            options: options,
            id: item.id
          };
        });

        setQuestions(quizData);
        setCurrentIndex(0);
        setScore(0);
        setFuzzyCount(0);
        setSelectedOption(null);
        setIsAnswered(false);
        setShowHint(false);
        setUsedHint(false);
        setWrongList([]);
        setFuzzyList([]);
        setGameState('quiz');
      };

      const handleUseHint = () => {
        setShowHint(true);
        setUsedHint(true);
      };

      const handleSelectOption = (index) => {
        if (isAnswered) return;
        setSelectedOption(index);
        setIsAnswered(true);

        const currentQ = questions[currentIndex];
        const isCorrectChoice = currentQ.options[index].isCorrect;

        if (isCorrectChoice) {
          if (usedHint) {
            setFuzzyCount(prev => prev + 1);
            setFuzzyList(prev => [...prev, currentQ]);
          } else {
            setScore(prev => prev + 1);
          }
        } else {
          setWrongList(prev => [...prev, currentQ]);
        }
      };

      const handleNextQuestion = () => {
        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(prev => prev + 1);
          setSelectedOption(null);
          setIsAnswered(false);
          setShowHint(false);
          setUsedHint(false);
        } else {
          const newStreak = streak + 1;
          setStreak(newStreak);
          localStorage.setItem('kobun_streak', newStreak);
          setGameState('result');
        }

                </button>
              </div>

              </div>
            </div>
          )}

          {}

                  <div className="text-3xl font-bold font-mincho text-slate-900 my-3 tracking-wide">
                    {questions[currentIndex].targetWord}

                  {!showHint ? (
                    <button
                      onClick={handleUseHint}

                        btnStyle = "bg-rose-100 text-rose-900 border-rose-400";
                      } else {
                        btnStyle = "bg-slate-50 text-slate-400 border-slate-200 opacity-60";
                      }
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => handleSelectOption(idx)}
                        disabled={isAnswered}
                        className={`w-full p-3.5 rounded-xl border-2 text-left text-sm transition-all flex items-center justify-between ${btnStyle}`}

                        <span>{opt.text}</span>

                  <p className="text-xs text-slate-600">

                    <div className="bg-amber-50/80 border border-amber-300 rounded-xl p-3">
                      <h3 className="text-xs font-bold text-amber-900 mb-2 flex items-center gap-1">
                        <i className="fa-regular fa-lightbulb text-amber-600"></i> うろ覚えの単語 ({fuzzyList.length}語)
                      </h3>
                      <div className="space-y-1.5">
                        {fuzzyList.map((item, idx) => (
                          <div key={idx} className="bg-white p-2 rounded border border-amber-200 text-xs flex justify-between items-center">
                            <span className="font-bold text-slate-900">{item.targetWord}</span>
                            <span className="text-amber-800 font-semibold">{item.correctMean}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {wrongList.length > 0 && (
                    <div className="bg-rose-50/80 border border-rose-300 rounded-xl p-3">
                      <h3 className="text-xs font-bold text-rose-900 mb-2 flex items-center gap-1">
                        <i className="fa-solid fa-triangle-exclamation text-rose-600"></i> 要復習の単語 ({wrongList.length}語)
                      </h3>
                      <div className="space-y-1.5">
                        {wrongList.map((item, idx) => (
                          <div key={idx} className="bg-white p-2 rounded border border-rose-200 text-xs flex justify-between items-center">
                            <span className="font-bold text-slate-900">{item.targetWord}</span>
                            <span className="text-rose-800 font-semibold">{item.correctMean}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div className="space-y-2 mt-4">
                <button
                  onClick={() => startQuiz()}
                  className="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3.5 rounded-xl shadow transition font-mincho flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-rotate-right"></i> もう一度挑戦する
                </button>
                <button
                  onClick={() => setGameState('home')}
                  className="w-full bg-amber-200 hover:bg-amber-300 text-amber-900 font-bold py-2.5 rounded-xl transition text-xs"
                >
                  ホームに戻る
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
